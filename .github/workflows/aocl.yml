# Runs the cpufish-aocl provider tests, then the S4 gemm benchmark (ROADMAP row 8), on a self-hosted Windows runner that
# has AMD AOCL installed (hosted runners have no AOCL, so hosted CI cannot run them; ROADMAP row 3, CLAUDE.md "tests that
# cannot run on GitHub"). The runner is ephemeral (one job per registration), so everything runs in this ONE job, and a
# failed step does not stop the later independent ones.
#
# Triggers: dispatch only. No pull_request (a PR would run our code on the maintainer's machine), no secrets, no
# third-party actions. The runner is ephemeral: one job per registration, so every run is a deliberate act.
name: aocl

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  aocl:
    name: cpufish-aocl tests and S4 bench (self-hosted, AOCL)
    runs-on: [self-hosted, Windows, X64, aocl]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Find AOCL, libiomp5md and libclang (fails loudly; nothing is installed or assumed)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # AOCL_ROOT is unset on the runner: look where the AOCL installer puts it.
          $lib = Join-Path $env:ProgramFiles 'AMD\AOCL-Windows\amd-blis\lib\LP64'
          foreach ($f in 'AOCL-LibBlis-Win-MT-dll.lib', 'AOCL-LibBlis-Win-MT-dll.dll') {
            if (-not (Test-Path -LiteralPath (Join-Path $lib $f))) { throw "AOCL: $f not found in $lib (is AOCL installed for this account?)" }
          }
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$lib`n")
          "AOCL BLIS      : $lib"

          # The multi-threaded BLIS needs libiomp5md.dll; AOCL does not ship it, oneAPI does.
          $iomp = Get-ChildItem -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'Intel\oneAPI') -Filter libiomp5md.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iomp) { throw 'libiomp5md.dll not found under Program Files (x86)\Intel\oneAPI (the multi-threaded BLIS cannot start without it)' }
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$($iomp.DirectoryName)`n")
          "libiomp5md     : $($iomp.FullName)"

          # bindgen (aocl-blas-sys) needs libclang.dll. Visual Studio's LLVM component ships it.
          $clang = $env:LIBCLANG_PATH
          if (-not ($clang -and (Test-Path -LiteralPath (Join-Path $clang 'libclang.dll')))) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (-not (Test-Path -LiteralPath $vswhere)) { throw "libclang: LIBCLANG_PATH unset and vswhere.exe not found at $vswhere" }
            $vs = & $vswhere -latest -products '*' -property installationPath | Select-Object -First 1
            $clang = if ($vs) { Join-Path $vs 'VC\Tools\Llvm\x64\bin' } else { $null }
          }
          if (-not ($clang -and (Test-Path -LiteralPath (Join-Path $clang 'libclang.dll')))) { throw "libclang.dll not found (LIBCLANG_PATH unset; Visual Studio LLVM component missing)" }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "LIBCLANG_PATH=$clang`n")
          "libclang       : $clang"

          foreach ($t in 'cargo', 'rustc') {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            if (-not $c) { throw "$t is not on PATH for this account" }
            "$t : $($c.Source)"
          }

      - name: cpufish-aocl tests
        shell: powershell
        run: |
          cargo test --locked -p cpufish-aocl --no-fail-fast -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Timings are not a ranking unless this shows the CPU was quiet: record what ran and how busy it was.
      - name: Machine and load (log only)
        if: always()
        shell: powershell
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed | Format-List | Out-String
          # Get-Counter threw CounterApiError for the runner account (run 41228682257); CIM needs no perf-counter registry.
          1..3 | ForEach-Object { "cpu busy %: $((Get-CimInstance Win32_Processor | Measure-Object LoadPercentage -Average).Average)"; Start-Sleep -Seconds 2 }
          Get-Process | Sort-Object CPU -Descending | Select-Object -First 8 Name, CPU | Format-Table | Out-String

      # oneMKL is optional here: the bench below runs without it if it is not found.
      - name: Find oneMKL (optional)
        id: mkl
        if: always()
        shell: powershell
        run: |
          $root = Get-ChildItem -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'Intel\oneAPI') -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'include\mkl.h') } | Sort-Object Name -Descending | Select-Object -First 1
          if ($root) {
            [IO.File]::AppendAllText($env:GITHUB_ENV, "MKLROOT=$($root.FullName)`n")
            [IO.File]::AppendAllText($env:GITHUB_PATH, (Join-Path $root.FullName 'bin') + "`n")
            "MKLROOT: $($root.FullName)"
            "mkl=found" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          } else {
            'oneMKL not found under Program Files (x86)\Intel\oneAPI; benching AOCL and portable only'
            "mkl=absent" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          }

      - name: Build the bench (aocl)
        if: always()
        shell: powershell
        run: |
          cargo build --release --locked -p cpufish-bench --features aocl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item 'target\release\cpufish-bench.exe' (Join-Path $env:RUNNER_TEMP 'bench-aocl.exe')

      - name: Build the bench (aocl + onemkl)
        if: always() && steps.mkl.outputs.mkl == 'found'
        shell: powershell
        run: |
          cargo build --release --locked -p cpufish-bench --features aocl,onemkl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item 'target\release\cpufish-bench.exe' (Join-Path $env:RUNNER_TEMP 'bench-both.exe')

      # Library defaults (as Fuel runs), then pinned thread counts, each recorded separately.
      - name: S4 bench
        if: always()
        shell: powershell
        run: |
          $both = Join-Path $env:RUNNER_TEMP 'bench-both.exe'
          $exe = if (Test-Path -LiteralPath $both) { $both } else { Join-Path $env:RUNNER_TEMP 'bench-aocl.exe' }
          "bench binary: $exe"
          $sum = $env:GITHUB_STEP_SUMMARY
          $bad = $false
          foreach ($t in @($null, 1, 4)) {
            $label = if ($null -eq $t) { 'library default threads' } else { "--threads $t" }
            $head = "### S4 bench, $label ($(Split-Path -Leaf $exe))"
            $out = if ($null -eq $t) { & $exe } else { & $exe --threads $t }
            $head, $out
            $head, $out | Out-File -Append -Encoding utf8 -FilePath $sum
            if ($LASTEXITCODE -ne 0) { "bench exited $LASTEXITCODE for $label"; $bad = $true }
          }
          if ($bad) { exit 1 }
