[package]
name = "cpufish"
version = "0.0.17"
edition = "2024"
rust-version = "1.95"
description = "Vendor-neutral CPU math layer for Fuel with per-vendor providers selected at run time"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/cpufish"
publish = false

[dependencies]
gemm = "0.19"
thiserror = "2"

# `cpufish-aocl` and `cpufish-onemkl` need a vendor install at build and run time, so they (and `cpufish-openblas`, whose tests need OpenBLAS) are members but not default members:
# plain `cargo build/test/clippy` at the root (hosted CI) never touches it. Build one with `-p <crate>`.
[workspace]
members = [".", "crates/cpufish-sys", "crates/cpufish-aocl", "crates/cpufish-onemkl", "crates/cpufish-openblas", "crates/cpufish-bench"]
default-members = [".", "crates/cpufish-sys"]
resolver = "3"
